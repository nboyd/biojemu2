[project]
name = "jbioemu2"
version = "0.1.0"
description = "JAX/Equinox port of the BioEmu2 score model and EDM sampler."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [
    { name = "nboyd", email = "nickboyd@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "einops>=0.8",
    "equinox>=0.13",
    "jax>=0.7",
    "jaxtyping>=0.3",
    "numpy>=2.1",
]

[project.optional-dependencies]
# Weight conversion, featurization (System/MSA -> Features), and parity tests use the
# PyTorch reference implementation; the JAX model itself never imports torch.
reference = [
    "bioemu2",
    "torch>=2.11,<2.14",
]
cuda = [
    "jax[cuda12]>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv.sources]
bioemu2 = { git = "https://github.com/microsoft/bioemu2", rev = "06be369dd555849165a737472d42d936959e46fc" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reference: needs the `reference` extra, the BioEmu2 checkpoint, and captured torch ground truth",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["F722", "UP037"]  # jaxtyping shape strings are not forward references
